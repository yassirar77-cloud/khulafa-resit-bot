name: uom-worklist-oneshot

# TEMPORARY. Fires the read-only seeding-worklist shadow run from this feature
# branch, because `workflow_dispatch` only registers once a workflow is on the
# default branch and this one is not there yet.
#
# Scoped hard: it runs ONLY on a push to this branch that touches
# `.github/uom-run-mode`, so ordinary commits never fire it. The mode file
# holds either `dry-run` (free — counts receipts, makes no OCR calls) or
# `full` (one vision call per receipt).
#
# Delete this file once the branch is merged; `uom-seeding-worklist.yml` is the
# permanent, manually-dispatched version.

on:
  push:
    branches:
      - claude/resit-bot-invoice-items-9w5yud
    paths:
      - .github/uom-run-mode

permissions:
  contents: write   # to commit the run's outcome back to this branch (see below)

jobs:
  worklist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal deps
        run: pip install --quiet supabase openai httpx Pillow tzdata
      - name: Shadow-run the invoice extractor (read-only)
        id: shadow
        continue-on-error: true   # a failed run must still report WHY, below
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          ZAI_BASE_URL: ${{ secrets.ZAI_BASE_URL }}
        run: |
          # Everything this step prints is teed to run-report.txt so the next
          # step can commit the reason back to the branch — including the
          # failure reasons, which are the ones worth reading. `pipefail` keeps
          # the real exit status through the pipe; the braces run in a subshell,
          # so `exit 1` below ends the pipeline rather than the whole shell.
          set -o pipefail
          {
            # First line is the mode; anything below it is free-text, so the
            # file can be nudged to re-fire a run without changing behaviour.
            MODE="$(head -n1 .github/uom-run-mode | tr -d '[:space:]')"
            echo "mode=$MODE"
            if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
              echo "ERROR: SUPABASE_URL / SUPABASE_KEY are not set as repo Actions secrets."
              echo "Add them at Settings → Secrets and variables → Actions → New repository secret:"
              echo "  SUPABASE_URL   https://<project>.supabase.co"
              echo "  SUPABASE_KEY   the service-role key the bot runs with"
              echo "  ZAI_API_KEY    (full runs only — the Z.ai key used for OCR)"
              echo "Then edit .github/uom-run-mode and push to re-fire this run."
              exit 1
            fi
            ARGS="--days 60 --date-field receipt_date --out uom_seeding_worklist.csv"
            if [ "$MODE" = "dry-run" ]; then
              ARGS="$ARGS --dry-run"
            elif [ -z "$ZAI_API_KEY" ]; then
              echo "ERROR: ZAI_API_KEY is required for a full run (mode=full)."
              echo "Add it at Settings → Secrets and variables → Actions, or set"
              echo ".github/uom-run-mode back to 'dry-run' for a free receipt count."
              exit 1
            fi
            python scripts/uom_seeding_worklist.py $ARGS
          } 2>&1 | tee run-report.txt
      - name: Commit the outcome back to this branch
        # The run's result has to come back to whoever asked for it, and the
        # Actions UI is not always reachable (an API client can lose its
        # connection; a phone can't download an artifact). Committing the CSV
        # and the report to the branch means `git fetch` is enough to read the
        # outcome — success or failure — with no other tooling.
        #
        # Writes only under docs/worklist/, which is NOT the trigger path, so
        # this commit cannot re-fire the workflow.
        if: always()
        run: |
          mkdir -p docs/worklist
          {
            echo "run_id:     ${{ github.run_id }}"
            echo "commit:     ${{ github.sha }}"
            echo "outcome:    ${{ steps.shadow.outcome }}"
            echo "mode:       $(head -n1 .github/uom-run-mode | tr -d '[:space:]')"
            echo
            cat run-report.txt 2>/dev/null || echo "(no report captured)"
          } > docs/worklist/last-run.txt
          if [ -f uom_seeding_worklist.csv ]; then
            cp uom_seeding_worklist.csv docs/worklist/uom_seeding_worklist.csv
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/worklist
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Worklist run ${{ github.run_id }}: ${{ steps.shadow.outcome }} [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
      - name: Fail the job if the shadow run failed
        if: ${{ steps.shadow.outcome == 'failure' }}
        run: exit 1
      - name: Publish the CSV to the job log and run summary
        if: ${{ hashFiles('uom_seeding_worklist.csv') != '' }}
        run: |
          echo "----- BEGIN WORKLIST CSV -----"
          cat uom_seeding_worklist.csv
          echo "----- END WORKLIST CSV -----"
          # Also render it on the run's summary page, so the worklist is
          # readable without downloading the artifact or opening the raw log.
          {
            echo "## uom_conversion seeding worklist"
            echo
            echo "Last 60 days of SUPPLIER_PURCHASE receipts, ranked by RM."
            echo
            echo '| supplier | canonical_item | unit_raw | line_count | total_RM |'
            echo '| --- | --- | --- | ---: | ---: |'
            tail -n +2 uom_seeding_worklist.csv | python3 -c "import csv,sys;[print('| '+' | '.join(r)+' |') for r in csv.reader(sys.stdin) if len(r)==5]"
            echo
            echo '<details><summary>Raw CSV</summary>'
            echo
            echo '```csv'
            cat uom_seeding_worklist.csv
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the worklist CSV
        if: ${{ hashFiles('uom_seeding_worklist.csv') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: uom-seeding-worklist
          path: uom_seeding_worklist.csv
